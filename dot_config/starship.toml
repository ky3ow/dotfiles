# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# Change the default prompt format
format = """ \
$username$directory$vcs$python$fill$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"]
git_modules = "$git_branch$git_commit$git_status"
jj_modules = "$jj_bookmark$jj_change$jj_status"

[jj_bookmark]
format = "[$bookmark(@$remote)$diverged(\\[+$overflow_count\\])]($style)"
style = 'bold yellow'

[jj_change]
format = "[@](bold green)$change:$commit "
suffix_style = "bold black"

[jj_status]
format = "([($conflicted )($description )($hidden )($immutable )($added )($copied )($deleted )($modified )($rename )]($style) )"
conflicted = '='
description_empty = '[?](bold yellow)'
immutable = '<>'
added = '[+$count](bold green)'
deleted = '-${count}'
renamed = '>>${count}'
modified = '!${count}'
copied = '&${count}'

[git_branch]
format = '[$branch(:$remote_branch)]($style)'
style = 'bold yellow'

[git_commit]
format = '[@$hash$tag]($style)'
only_detached = false

[git_status]
format = '[[\($ahead_behind\) ](bold green)($conflicted )($deleted )($renamed )($modified )($staged )($untracked )($stashed )](bold red)'
up_to_date = '[*](bold yellow)'
diverged = '[${ahead_count}](bold blue)[:](bold green)[${behind_count}](bold purple)'
ahead = '[${count}](bold blue)'
behind = '[${count}](bold purple)'
conflicted = '=${count}'
deleted = '-${count}'
renamed = '>>${count}'
modified = '!${count}'
staged = '[+$count](bold green)'
untracked = '?'
stashed = '[\$${count}](bold purple)'

[username]
show_always = true

